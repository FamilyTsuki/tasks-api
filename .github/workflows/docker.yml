name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Calculer le propriétaire en minuscules
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Déterminer la version de l'application
        id: app-version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Métadonnées Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.owner }}/tasks-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Démarrer le conteneur en staging
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/tasks-api:sha-${GITHUB_SHA::7}"
          docker run -d --name tasks-api-staging -p 8000:8000 "${IMAGE}"

      - name: Test de fumée (smoke test)
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health; then
              echo "Le service répond sur /health !"
              break
            fi
            echo "En attente du démarrage..."
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/version

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Démarrer le conteneur en production
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${OWNER}/tasks-api:${VERSION}"
          docker run -d --name tasks-api-prod -p 8000:8000 "${IMAGE}"

      - name: Test de fumée (smoke test)
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health; then
              echo "Le service répond sur /health !"
              break
            fi
            echo "En attente du démarrage..."
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/version

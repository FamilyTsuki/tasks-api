name: Secret demo
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN est vide"
            exit 1
          fi
      - run: echo "longueur ${#DEMO_TOKEN}"
      - run: echo "valeur $DEMO_TOKEN"
      - run: echo "APP_ENV = ${{ vars.APP_ENV }}"
